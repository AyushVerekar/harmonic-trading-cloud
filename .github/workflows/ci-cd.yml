name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: harmonic-cloud-ayush
  REGION: asia-south1
  SERVICE: harmonic-signal-api
  AR_REPO: harmonic-repo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.api.txt
            requirements.dev.txt
      - run: pip install -r requirements.api.txt -r requirements.dev.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
          IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}
          docker build -t ${IMAGE}:${GITHUB_SHA} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${GITHUB_SHA}
          docker push ${IMAGE}:latest

      - name: Deploy candidate revision (no traffic)
        run: |
          IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}
          gcloud run deploy ${SERVICE} \
            --image ${IMAGE}:${GITHUB_SHA} \
            --region ${REGION} \
            --no-traffic --tag candidate \
            --update-env-vars MODEL_VERSION=${GITHUB_SHA::7}

      - name: Smoke test the candidate
        run: |
          URL=$(gcloud run services describe ${SERVICE} --region ${REGION} --format='value(status.url)')
          CAND="https://candidate---${URL#https://}"
          curl -sf --retry 6 --retry-delay 5 --retry-connrefused ${CAND}/health | tee health.json
          grep -q "${GITHUB_SHA::7}" health.json

      - name: Promote candidate to 100 percent traffic
        run: gcloud run services update-traffic ${SERVICE} --region ${REGION} --to-latest
